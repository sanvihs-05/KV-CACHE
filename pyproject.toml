[project]
name = "kvwear"
version = "0.1.0"
description = "Measure and reduce SSD wear from on-device LLM KV-cache offloading"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6"]

[project.optional-dependencies]
gpu = ["torch>=2.4", "transformers>=4.46", "accelerate"]
extra = ["zstandard", "tabulate"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["kvwear", "kvwear.engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
